[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ussd-reborn"
version = "1.0.0"
description = "GhostSignal: a universal USSD skeleton resurrecting 2G telecom with AI (Kiroween 2026, Skeleton Crew)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["core", "channels", "mcp_server", "scripts"]
